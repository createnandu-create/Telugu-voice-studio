name: Build and publish Telugu Voice Studio debug downloads

on:
  push:
    branches: [telugu-voice-testing]
    paths:
      - 'offline-tts-android/**'
      - '.agents/skills/**'
      - 'docs/ASTRA6_HANDOFF.md'
      - 'AGENTS.md'
      - '.github/workflows/offline-tts-debug.yml'
  workflow_dispatch:

concurrency:
  group: telugu-voice-testing-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug_apk:
    if: github.ref == 'refs/heads/telugu-voice-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform and tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK is not configured on the build runner" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          # Hosted runners commonly have both packages. Avoid a remote repository refresh
          # (and its network timeouts) when the required tools are already installed.
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/zipalign" ]; then
            echo "Required Android 35 SDK and build-tools 35.0.0 already installed"
          else
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Verify offline bundles and run Java tests
        run: |
          python3 offline-tts-android/scripts/verify-bundle.py
          python3 offline-tts-android/scripts/test-android-regex.py
          bash offline-tts-android/scripts/test-restoration.sh
          bash offline-tts-android/scripts/test-java.sh

      - name: Build Android 15 debug APK
        run: gradle --no-daemon --project-dir offline-tts-android :app:assembleDebug :app:assembleFresh

      - name: Compose navigation, persistence tests and Android lint
        run: gradle --no-daemon --project-dir offline-tts-android :app:testDebugUnitTest :app:lintDebug

      - name: Upload test reports and native UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Studio-test-reports
          path: offline-tts-android/app/build/reports/
          if-no-files-found: warn

      - name: Validate both standalone install packages and signing
        run: |
          set -euo pipefail
          APK_DEBUG=offline-tts-android/app/build/outputs/apk/debug/app-debug.apk
          APK_FRESH=offline-tts-android/app/build/outputs/apk/fresh/app-fresh.apk
          for apk in "$APK_DEBUG" "$APK_FRESH"; do
            test -s "$apk"
            unzip -t "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_DEBUG" | grep -Fq "name='in.aitechapp.teluguoffline'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_FRESH" | grep -Fq "name='in.aitechapp.teluguoffline.fresh'"
          echo "APK ZIP structure, signatures, alignment and separate package IDs verified."


      - name: Prepare APK and source ZIP for direct download
        run: |
          set -euo pipefail
          mkdir -p dist
          cp offline-tts-android/app/build/outputs/apk/debug/app-debug.apk dist/TeluguVoiceStudio-debug.apk
          cp offline-tts-android/app/build/outputs/apk/fresh/app-fresh.apk dist/TeluguVoiceStudio-fresh-install.apk
          git archive --format=zip --output=dist/TeluguVoiceStudio-source.zip HEAD
          python3 -m zipfile -c dist/TeluguVoiceStudio-pronunciation-AB.zip docs/evaluation/pronunciation-v04 docs/evaluation/dsp-v05 docs/evaluation/pronunciation-v06 docs/evaluation/delivery-v07
          cp docs/evaluation/pronunciation-v06/Namaskaram-Piper-*.wav dist/
          cp docs/evaluation/delivery-v07/samples/*-youtube-directed.wav dist/
          python3 -m zipfile -c dist/TeluguVoiceStudio-four-voices.zip docs/evaluation/delivery-v07/samples/*-youtube-directed.wav
          python3 -m zipfile -c dist/TeluguVoiceStudio-restoration-AB.zip docs/evaluation/restoration-v57
          (cd dist && sha256sum *.apk *.zip *.wav > SHA256SUMS.txt)
          test -s dist/TeluguVoiceStudio-debug.apk
          test -s dist/TeluguVoiceStudio-fresh-install.apk
          test -s dist/TeluguVoiceStudio-source.zip

      - name: Upload files to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TeluguVoiceStudio-APK-and-Source
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified immutable and rolling test releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="testing-${GITHUB_SHA:0:12}"
          cat > /tmp/release-notes.md <<EOF
          Native ARM64 Android test build from commit $GITHUB_SHA.
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          v57 fixes the Android ICU SpeechMarkup regex crash shown in the user's screenshots. Failed jobs show actionable errors.

          Voices → Enhance creates a new private RNNoise-cleaned copy, with optional experimental WPE room-tail reduction. Originals stay intact. Settings → Offline models → Cloning offers the optional SHA-verified ECAPA speaker encoder; Voices → Enroll saves a consented 192-D fingerprint locally. A fingerprint is NOT a working cloned narrator and is not injected into fixed-speaker Piper/Tiny.

          TeluguVoiceStudio-restoration-AB.zip contains synthetic-noise/echo input and output audio plus measurements. Host tests measured 19.7 dB noise-region attenuation and 5.1 dB echo-tail reduction on these fixtures, not arbitrary real environments. No zero-echo, recovered-speech, cloned-voice, or Nothing Phone performance claim is made. Physical-phone testing remains outstanding.

          The normal debug APK updates the existing package with the same pinned certificate. The optional fresh-install APK is a separate app with separate data; do not uninstall your existing app to try it. Existing narrator models, original recordings and saved projects are preserved.

          Four-voice comparison WAVs remain the v0.7.1 public pretrained speech fixtures; v57 changes recording restoration/enrollment, not those voice weights. No paid API or hosted inference is added.

          See docs/evaluation/restoration-v57 for implementation, reproducible tests and limitations. Source includes corresponding-source archives and licenses. This is a publicly debug-signed test build. Check SHA256SUMS.txt after downloading.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Telugu Voice Studio v57 — ${GITHUB_SHA:0:12}" --notes-file /tmp/release-notes.md
          fi
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest dist/* --clobber
            gh release edit debug-latest --notes-file /tmp/release-notes.md
          else
            gh release create debug-latest dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Telugu Voice Studio — latest debug APK" --notes-file /tmp/release-notes.md
          fi
          # Verify release binary round-trip, not only the CI workspace APK.
          mkdir -p /tmp/check-immutable /tmp/check-rolling
          gh release download "$TAG" --pattern TeluguVoiceStudio-debug.apk --pattern TeluguVoiceStudio-fresh-install.apk --dir /tmp/check-immutable
          gh release download debug-latest --pattern TeluguVoiceStudio-debug.apk --pattern TeluguVoiceStudio-fresh-install.apk --dir /tmp/check-rolling
          for apk in TeluguVoiceStudio-debug.apk TeluguVoiceStudio-fresh-install.apk; do
            cmp "dist/$apk" "/tmp/check-immutable/$apk"
            cmp "dist/$apk" "/tmp/check-rolling/$apk"
          done
          echo "Immutable and rolling release APK downloads byte-for-byte verified"
