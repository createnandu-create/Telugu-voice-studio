name: Build Telugu Offline TTS Debug APK
on:
  push:
    branches: [telugu-voice-testing]
    paths:
      - 'offline-tts-android/**'
      - '.github/workflows/offline-tts-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android 35 with runner SDK
        run: |
          echo "SDK root: ${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Verify pure Java narration tests
        run: |
          mkdir -p /tmp/narration-tests
          javac -encoding UTF-8 -d /tmp/narration-tests offline-tts-android/app/src/main/java/in/aitechapp/teluguoffline/NarrationDirector.java offline-tts-android/app/src/main/java/in/aitechapp/teluguoffline/SemanticNarrationPrompt.java offline-tts-android/tests/NarrationDirectorTest.java
          java -cp /tmp/narration-tests in.aitechapp.teluguoffline.NarrationDirectorTest
      - name: Build debug APK
        run: gradle --no-daemon --project-dir offline-tts-android :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguOfflineVoice-debug-apk
          path: offline-tts-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
