name: Build and publish Telugu Voice Studio debug downloads

on:
  push:
    branches: [telugu-voice-testing]
    paths:
      - 'offline-tts-android/**'
      - '.agents/skills/**'
      - 'docs/ASTRA6_HANDOFF.md'
      - 'AGENTS.md'
      - '.github/workflows/offline-tts-debug.yml'
  workflow_dispatch:

concurrency:
  group: telugu-voice-testing-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug_apk:
    if: github.ref == 'refs/heads/telugu-voice-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform and tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK is not configured on the build runner" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          # Hosted runners commonly have both packages. Avoid a remote repository refresh
          # (and its network timeouts) when the required tools are already installed.
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/zipalign" ]; then
            echo "Required Android 35 SDK and build-tools 35.0.0 already installed"
          else
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Verify offline bundles and run Java tests
        run: |
          python3 offline-tts-android/scripts/verify-bundle.py
          bash offline-tts-android/scripts/test-java.sh

      - name: Build Android 15 debug APK
        run: gradle --no-daemon --project-dir offline-tts-android :app:assembleDebug

      - name: Compose navigation, persistence tests and Android lint
        run: gradle --no-daemon --project-dir offline-tts-android :app:testDebugUnitTest :app:lintDebug

      - name: Upload test reports and native UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Studio-test-reports
          path: offline-tts-android/app/build/reports/
          if-no-files-found: warn

      - name: Verify APK signature and 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose offline-tts-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 offline-tts-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK and source ZIP for direct download
        run: |
          set -euo pipefail
          mkdir -p dist
          cp offline-tts-android/app/build/outputs/apk/debug/app-debug.apk dist/TeluguVoiceStudio-debug.apk
          git archive --format=zip --output=dist/TeluguVoiceStudio-source.zip HEAD
          python3 -m zipfile -c dist/TeluguVoiceStudio-pronunciation-AB.zip docs/evaluation/pronunciation-v04 docs/evaluation/dsp-v05 docs/evaluation/pronunciation-v06
          cp docs/evaluation/pronunciation-v06/Namaskaram-Piper-*.wav dist/
          (cd dist && sha256sum TeluguVoiceStudio-debug.apk TeluguVoiceStudio-source.zip TeluguVoiceStudio-pronunciation-AB.zip Namaskaram-Piper-Male.wav Namaskaram-Piper-Female.wav > SHA256SUMS.txt)
          test -s dist/TeluguVoiceStudio-debug.apk
          test -s dist/TeluguVoiceStudio-source.zip

      - name: Upload files to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TeluguVoiceStudio-APK-and-Source
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified immutable and rolling test releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="testing-${GITHUB_SHA:0:12}"
          cat > /tmp/release-notes.md <<EOF
          Native ARM64 Android test build from commit $GITHUB_SHA.
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Version 0.6 repairs a confirmed Piper input-contract mismatch: sherpa 1.12.26 omitted the blank immediately after BOS. Pinned ONNX input adapters restore that token without changing learned weights or the user's script. Existing models migrate locally without downloading; a rollback copy is retained. Generate again to avoid old cached audio. The repaired graphs exactly matched original Piper graphs receiving the correct IDs in deterministic host tests. This does not prove all pronunciation complaints are solved.

          Indic Tiny Telugu is now a second, experimental Java/ARM64 engine: character encoder, flow decoder and Vocos, with one verified 91 MB pack shared by male/female. Actual Java host audio was generated; Nothing Phone inference, native pronunciation and performance remain unverified. Models are under Settings → Offline models → Telugu Narration. No semantic LLM, emotional clone or 90% naturalness claim is made.

          Check నమస్కారం pronunciation generates three contexts using the selected installed voice without replacing your script. Save audio offers WAV or genuine offline 320 kbps MP3, visible progress/cancel, saved filename and Open/Share. Model verification shows an active state and a timestamped result. Save remains visible at 360 dp. Previous recording, model-resume and original-audio features are retained.

          Public pretrained-model pronunciation samples are included, including two direct నమస్కారం WAVs. They are not personal recordings or cloned voices. Read docs/evaluation/pronunciation-v06 for reproducible tests, runtime isolation, licensing and outstanding phone/listening checks.

          The source ZIP includes application source, licenses and upstream corresponding-source archives. This is a publicly debug-signed test APK, not a production release. All files below belong to this commit; SHA256SUMS.txt can be checked after download.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Telugu Voice Studio 0.6 — ${GITHUB_SHA:0:12}" --notes-file /tmp/release-notes.md
          fi
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest dist/* --clobber
            gh release edit debug-latest --notes-file /tmp/release-notes.md
          else
            gh release create debug-latest dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Telugu Voice Studio — latest debug APK" --notes-file /tmp/release-notes.md
          fi
