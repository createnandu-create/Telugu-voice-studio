name: Build and publish Telugu Voice Studio debug downloads

on:
  push:
    branches: [telugu-voice-testing]
    paths:
      - 'offline-tts-android/**'
      - '.agents/skills/**'
      - 'docs/ASTRA6_HANDOFF.md'
      - 'AGENTS.md'
      - '.github/workflows/offline-tts-debug.yml'
  workflow_dispatch:

concurrency:
  group: telugu-voice-testing-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  debug_apk:
    if: github.ref == 'refs/heads/telugu-voice-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform and tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK is not configured on the build runner" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          # Hosted runners commonly have both packages. Avoid a remote repository refresh
          # (and its network timeouts) when the required tools are already installed.
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ] && \
             [ -x "$SDK_ROOT/build-tools/35.0.0/zipalign" ]; then
            echo "Required Android 35 SDK and build-tools 35.0.0 already installed"
          else
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Verify offline bundles and run Java tests
        run: |
          python3 offline-tts-android/scripts/verify-bundle.py
          python3 offline-tts-android/scripts/test-android-regex.py
          bash offline-tts-android/scripts/test-restoration.sh
          bash offline-tts-android/scripts/test-java.sh

      - name: Build the unified APK and run Android tests
        run: gradle --no-daemon --project-dir offline-tts-android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Verify upgrade package and certificate against v0.8.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/v0811"
          apk=dist/TeluguVoiceStudio-v0.8.12.apk
          cp offline-tts-android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release download v0.8.11-c421132c93be -p TeluguVoiceStudio-v0.8.11.apk -D "$RUNNER_TEMP/v0811"
          previous="$RUNNER_TEMP/v0811/TeluguVoiceStudio-v0.8.11.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$previous" > "$RUNNER_TEMP/old-cert"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/new-cert"
          diff <(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/old-cert") <(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/new-cert")
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/new-badging"
          "$tools/aapt2" dump badging "$previous" > "$RUNNER_TEMP/old-badging"
          grep -F "package: name='in.aitechapp.teluguoffline.fresh' versionCode='70' versionName='0.8.12'" "$RUNNER_TEMP/new-badging"
          grep -F "package: name='in.aitechapp.teluguoffline.fresh' versionCode='69'" "$RUNNER_TEMP/old-badging"
          "$tools/zipalign" -c -P 16 4 "$apk"
          for graph in fastpitch-pace hima-encoder; do
            unzip -p "$apk" "assets/$graph.pb.bin" | cmp - "offline-tts-android/app/src/main/assets/$graph.pb.bin"
          done
          cp docs/evaluation/v0811/Channel-Name-Comparison.zip docs/evaluation/v0812/English-Notation-Comparison.zip dist/
          git archive -o dist/TeluguVoiceStudio-v0.8.12-source.zip HEAD

      - name: Generate four narrators and verify quiet-reference OpenVoice conversion
        run: |
          set -euo pipefail
          bash offline-tts-android/scripts/release-audio.sh "$RUNNER_TEMP/listening"
          cp "$RUNNER_TEMP/listening/"{Padmavathi,Venkatesh,Indic_Tiny_Male,Indic_Tiny_Female}_Clean.mp3 dist/
          bash offline-tts-android/scripts/alternative-release-audio.sh "$RUNNER_TEMP/listening" "$GITHUB_WORKSPACE/dist/TeluguVoiceStudio-v0.8.12.apk"
          cp "$RUNNER_TEMP/listening/"{Technical-Telugu-Comparison.zip,YouTube-Voice-Comparison.zip,narration-recognition.json} dist/
          cp "$RUNNER_TEMP/listening/"{hima-srinivas,hima-bhavana,fastpitch-male,fastpitch-female}.wav dist/
          cp "$RUNNER_TEMP/listening/"*-full-demo.mp3 dist/
          cp "$RUNNER_TEMP/listening/"/hima-{lakshmi,sravani,karthik,pranay}.wav dist/
          (cd "$RUNNER_TEMP/listening" && sha256sum *.wav *.mp3 > SHA256SUMS.txt)
          (cd "$RUNNER_TEMP/listening" && zip -q "$GITHUB_WORKSPACE/dist/TeluguVoiceStudio-v0.8.12-audio.zip" ./*)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-checks
          path: offline-tts-android/app/build/reports

      - name: Publish the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.8.12-${GITHUB_SHA:0:12}"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title 'Telugu Voice Studio v0.8.12' --notes 'In-place upgrade preserving models and recordings. English technical readings are selected by default. Includes offline Telugu-script rendering of ratios, numeric roots and equalities, percentages, 192-D Vocal DNA and 4K. Model-dependent pronunciation and phone listening remain evaluation items.'
          gh release download "$tag" -D "$RUNNER_TEMP/release-check"
          for file in dist/*; do cmp "$file" "$RUNNER_TEMP/release-check/$(basename "$file")"; done
