plugins { id 'com.android.application' }
android {
    namespace 'in.aitechapp.teluguoffline'
    compileSdk 35
    defaultConfig { applicationId 'in.aitechapp.teluguoffline'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0-neural-test'; ndk { abiFilters 'arm64-v8a' } }
    signingConfigs {
        debug {
            storeFile file('../signing/public-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
